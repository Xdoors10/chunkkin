[package]
name = "chunkkin"
version = "0.1.0"
edition = "2024"
authors = ["Dzhibr0ny"]
description = "High-performance world pre-generation plugin for the Pumpkin Minecraft server"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The API version must match your Pumpkin server build.
# Pin a branch or rev that matches your server, e.g.:
#   pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master" }
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "2d6a9a4f9" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
