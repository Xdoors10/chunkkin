[package]
name = "pumpkin-pregen"
version = "0.1.0"
edition = "2024"
authors = ["Dzhibr0ny"]
description = "High-performance world pre-generation plugin for the Pumpkin Minecraft server"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumpkin-plugin-api = "0.1.0-dev"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
